[project]
name = "ai-baby-monitor"
version = "0.1.0"
description = "Simple baby monitor running on Video LLMs"
readme = "README.md"
authors = [
    { name = "zeenolife", email = "almaz.zinollayev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python>=4.11.0.86",
    "playsound3>=3.2.3",
    "python-dotenv>=1.1.0",
    "redis>=5.2.1",
    "streamlit>=1.42.2",
    "structlog>=25.2.0",
    "openai>=1.0.0",
    "pyyaml>=6.0.2",
    "httpx[socks]>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
