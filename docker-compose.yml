services:
  redis:
    image: redis:latest
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - app-network

  python-base:
    build:
      context: .
      dockerfile: Dockerfile.python
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./scripts:/app/scripts
      - ./configs:/app/configs
      - ./src:/app/src
      - ./assets:/app/assets

  stream_to_redis:
    extends:
      service: python-base
    command: >
      sh -c "
      uv run python scripts/stream_to_redis.py --config-file configs/living_room.yaml --demo
      "

  streamlit_viewer:
    extends:
      service: python-base
    command: >
      sh -c "
      uv run streamlit run scripts/streamlit_viewer.py --server.port 8501 --server.address 0.0.0.0 -- --config-files configs/living_room.yaml
      "
    ports:
      - "8501:8501"

networks:
  app-network:
    driver: bridge

